name: Manual Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, e.g. 1.2.3 or v1.2.3"
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0



      - name: Show Xcode version
        run: xcodebuild -version

      - name: Normalize semantic version
        id: version_meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          RAW="${INPUT_VERSION}"
          VERSION="${RAW#v}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${RAW}'. Use semantic version like 1.2.3 or v1.2.3." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build package
        run: bash scripts/build-package.sh --version "${{ steps.version_meta.outputs.version }}"

      - name: Create zip artifact
        run: |
          ZIP_PATH="dist/Rewind-${{ steps.version_meta.outputs.release_tag }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Rewind.app" "${ZIP_PATH}"

      - name: Generate Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "missing SPARKLE_PRIVATE_KEY secret" >&2
            exit 1
          fi
          
          # Move zip out temporarily to avoid duplicate archive error
          mv dist/*.zip ./
          echo "${SPARKLE_PRIVATE_KEY}" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.version_meta.outputs.release_tag }}/" dist/
          mv ./*.zip dist/

      - name: Deploy Appcast to GitHub Pages
        run: |
          git clone --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pages_repo || {
            echo "gh-pages branch does not exist, creating it..."
            git init pages_repo
            cd pages_repo
            git checkout -b gh-pages
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            cd ..
          }
          
          cp dist/appcast.xml pages_repo/
          
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore: update appcast.xml for ${{ steps.version_meta.outputs.release_tag }}" || exit 0
          git push origin gh-pages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rewind-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/appcast.xml
            dist/Rewind.app
          if-no-files-found: error

      - name: Generate Changelog
        id: changelog
        run: |
          git fetch --tags --force
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "${GITHUB_OUTPUT}"
          echo "$LOG" >> "${GITHUB_OUTPUT}"
          echo "$EOF" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.release_tag }}
          name: Rewind ${{ steps.version_meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Post Changelog to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${DISCORD_WEBHOOK}" ]; then
            echo "missing DISCORD_WEBHOOK secret"
            exit 0
          fi
          
          # Fetch the generated release notes using the GitHub CLI
          RELEASE_BODY=$(gh release view "${{ steps.version_meta.outputs.release_tag }}" --json body -q .body)
          
          # Construct a Discord embed payload
          # Truncate the body to Discord's 4096 character limit for embed descriptions just in case
          TRUNCATED_BODY="${RELEASE_BODY:0:4000}"
          if [ "${#RELEASE_BODY}" -gt 4000 ]; then
            TRUNCATED_BODY="${TRUNCATED_BODY}..."
          fi
          
          JSON_PAYLOAD=$(jq -n \
            --arg title "Rewind ${{ steps.version_meta.outputs.release_tag }} Released!" \
            --arg desc "$TRUNCATED_BODY" \
            --arg url "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version_meta.outputs.release_tag }}" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: 5814783}]}')
            
          curl -s -X POST -H "Content-Type: application/json" -d "$JSON_PAYLOAD" "${DISCORD_WEBHOOK}"

