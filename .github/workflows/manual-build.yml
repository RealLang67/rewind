name: Manual Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, e.g. 1.2.3 or v1.2.3"
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4



      - name: Show Xcode version
        run: xcodebuild -version

      - name: Normalize semantic version
        id: version_meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          RAW="${INPUT_VERSION}"
          VERSION="${RAW#v}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${RAW}'. Use semantic version like 1.2.3 or v1.2.3." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build package
        run: bash scripts/build-package.sh --version "${{ steps.version_meta.outputs.version }}"

      - name: Create zip artifact
        run: |
          ZIP_PATH="dist/Rewind-${{ steps.version_meta.outputs.release_tag }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Rewind.app" "${ZIP_PATH}"

      - name: Generate Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "missing SPARKLE_PRIVATE_KEY secret" >&2
            exit 1
          fi
          
          echo "${SPARKLE_PRIVATE_KEY}" > sparkle_priv.txt
          .build/artifacts/sparkle/Sparkle/bin/generate_keys -f sparkle_priv.txt
          
          # Move zip out temporarily to avoid duplicate archive error
          mv dist/*.zip ./
          .build/artifacts/sparkle/Sparkle/bin/generate_appcast --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.version_meta.outputs.release_tag }}/" dist/
          mv ./*.zip dist/

      - name: Deploy Appcast to GitHub Pages
        run: |
          git clone --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pages_repo || {
            echo "gh-pages branch does not exist, creating it..."
            git init pages_repo
            cd pages_repo
            git checkout -b gh-pages
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            cd ..
          }
          
          cp dist/appcast.xml pages_repo/
          
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore: update appcast.xml for ${{ steps.version_meta.outputs.release_tag }}" || exit 0
          git push origin gh-pages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rewind-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/appcast.xml
            dist/Rewind.app
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.release_tag }}
          name: Rewind ${{ steps.version_meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
          overwrite_files: true
          fail_on_unmatched_files: true

